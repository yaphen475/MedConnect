{% load i18n %}
<form class="language-switcher{% if in_header %} language-switcher-header{% endif %}" method="post" action="{% url 'set_language' %}" aria-label="{% trans 'Language' %}">
    {% csrf_token %}
    <input type="hidden" name="next" value="{{ request.get_full_path }}">
    <i class="bi bi-globe2" aria-hidden="true"></i>
    <select name="language" aria-label="{% trans 'Select language' %}" onchange="this.form.submit()">
        <option value="en"{% if LANG_CODE == 'en' %} selected{% endif %}>English</option>
        <option value="fr"{% if LANG_CODE == 'fr' %} selected{% endif %}>Français</option>
    </select>
</form>
